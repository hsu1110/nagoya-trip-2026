        // --- Functions ---
        const attractionsGrid = document.getElementById('attractions-grid');
        const foodGrid = document.getElementById('food-grid');
        const modalBg = document.getElementById('modal-bg');
        const modalBody = document.getElementById('modal-body');

        function renderCards(filter = 'All') {
            attractionsGrid.innerHTML = '';
            foodGrid.innerHTML = '';

            const filteredData = filter === 'All' ? db : db.filter(item => item.area === filter);

            filteredData.forEach(item => {
                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-xl shadow-sm border border-slate-100 cursor-pointer hover:shadow-md transition-shadow flex items-start space-x-4";
                card.onclick = () => openModal(item);

                const iconDiv = document.createElement('div');
                iconDiv.className = `w-12 h-12 rounded-full flex items-center justify-center flex-shrink-0 ${item.color}`;
                iconDiv.innerHTML = `<i class="fa-solid ${item.icon} text-xl"></i>`;

                const contentDiv = document.createElement('div');
                contentDiv.className = "flex-1";
                contentDiv.innerHTML = `
                    <div class="text-xs font-bold text-slate-400 mb-1 uppercase tracking-wider">${item.area}</div>
                    <h3 class="text-lg font-bold text-slate-800 leading-tight mb-2">${item.name}</h3>
                    <p class="text-sm text-slate-500 line-clamp-2">${item.notes}</p>
                `;

                card.appendChild(iconDiv);
                card.appendChild(contentDiv);

                if (item.type === 'attraction') {
                    attractionsGrid.appendChild(card);
                } else {
                    foodGrid.appendChild(card);
                }
            });

            // Show empty state if needed
            if(attractionsGrid.innerHTML === '') attractionsGrid.innerHTML = '<p class="text-slate-400 text-sm">此區域目前無景點資料</p>';
            if(foodGrid.innerHTML === '') foodGrid.innerHTML = '<p class="text-slate-400 text-sm">此區域目前無美食資料</p>';
        }

        function filterByArea(area) {
            // Update button styles
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.getAttribute('data-area') === area) {
                    btn.classList.add('active-filter');
                    btn.classList.remove('text-slate-600', 'bg-slate-100');
                } else {
                    btn.classList.remove('active-filter');
                    btn.classList.add('text-slate-600');
                }
            });

            renderCards(area);
        }

        function openModal(item) {
            // 使用精準校正過的 mapQuery，若無則降級使用店名
            const exactQuery = item.mapQuery || item.name;
            const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(exactQuery)}`;
            
            let extraDetails = '';
            if (item.type === 'attraction') {
                extraDetails = `
                    <div class="mb-3"><span class="font-bold text-slate-700 w-20 inline-block"><i class="fa-regular fa-clock mr-2"></i>時間:</span> <span class="text-slate-600">${item.hours}</span></div>
                    <div class="mb-3"><span class="font-bold text-slate-700 w-20 inline-block"><i class="fa-solid fa-train mr-2"></i>交通:</span> <span class="text-slate-600">${item.transport}</span></div>
                `;
            } else {
                extraDetails = `
                    <div class="mb-3"><span class="font-bold text-slate-700 w-20 inline-block"><i class="fa-solid fa-tag mr-2"></i>分類:</span> <span class="text-slate-600 bg-slate-100 px-2 py-1 rounded-md text-sm">${item.category}</span></div>
                    <div class="mb-3"><span class="font-bold text-slate-700 w-20 inline-block"><i class="fa-regular fa-clock mr-2"></i>時間:</span> <span class="text-slate-600">${item.hours}</span></div>
                `;
            }

            modalBody.innerHTML = `
                <div class="flex items-center space-x-3 mb-4">
                    <div class="w-10 h-10 rounded-full flex items-center justify-center ${item.color}">
                        <i class="fa-solid ${item.icon}"></i>
                    </div>
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">${item.area}</span>
                </div>
                <h2 class="text-2xl font-bold text-slate-800 mb-6 leading-snug">${item.name}</h2>
                
                <div class="bg-slate-50 p-4 rounded-xl mb-6 text-sm border border-slate-100">
                    <div class="mb-3"><span class="font-bold text-slate-700 w-20 inline-block"><i class="fa-solid fa-location-dot mr-2"></i>地點:</span> <span class="text-slate-600">${item.location}</span></div>
                    ${extraDetails}
                </div>

                <div class="mb-8">
                    <h4 class="font-bold text-slate-800 mb-2">專家筆記 <i class="fa-solid fa-pen-to-square text-amber-500 ml-1"></i></h4>
                    <p class="text-slate-600 leading-relaxed bg-amber-50 p-4 rounded-xl border border-amber-100">${item.notes}</p>
                </div>

                <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="block w-full bg-blue-600 hover:bg-blue-700 text-white text-center font-bold py-3 rounded-xl transition-colors shadow-md">
                    <i class="fa-solid fa-map-location-dot mr-2"></i>精準開啟 Google Maps
                </a>
            `;
            modalBg.classList.remove('hidden');
            document.getElementById('modal-content').classList.add('modal-enter');
            document.body.style.overflow = 'hidden'; // prevent background scrolling
        }

        function closeModal() {
            modalBg.classList.add('hidden');
            document.getElementById('modal-content').classList.remove('modal-enter');
            document.body.style.overflow = 'auto';
        }

        // Close modal when clicking outside
        modalBg.addEventListener('click', (e) => {
            if (e.target === modalBg) {
                closeModal();
            }
        });

        // Initialize
        renderCards();

    </script>
